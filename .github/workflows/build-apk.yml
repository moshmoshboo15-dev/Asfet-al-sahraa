name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor and create Android project
        run: |
          WEBDIR="client"
          if [ -f package.json ]; then
            npm install
            if grep -q '"build"' package.json; then
              npm run build
              WEBDIR="dist"
            fi
          else
            npm init -y
          fi
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.mohammad.ashfront",
            "appName": "Ashfront",
            "webDir": "$WEBDIR",
            "server": { "androidScheme": "http", "cleartext": true }
          }
          EOF
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ashfront-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
